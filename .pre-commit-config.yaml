repos:
  - repo: local
    hooks:
      - id: local-eslint-check
        name: ESLint Check
        entry: npx eslint --fix
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts))$"
        exclude: "^(src/api/gen/.*|src/routeTree\\.gen\\.ts)$"
        pass_filenames: true
        stages: [pre-commit]
      
      - id: tsc-typecheck
        name: TypeScript Type Check
        entry: npx tsc --noEmit
        language: system
        types: [text]
        files: "\\.(ts|tsx)$"
        pass_filenames: false
        stages: [pre-commit]
