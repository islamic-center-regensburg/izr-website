name: Build, Push and Deploy

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image version
        id: vars
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and (optionally) push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/izr-website:${{ steps.vars.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/izr-website:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_MOSQUE_NAME=${{ vars.VITE_MOSQUE_NAME }}
            VITE_INSTAGRAM_LINK=${{ vars.VITE_INSTAGRAM_LINK }}
            VITE_FACEBOOK_LINK=${{ vars.VITE_FACEBOOK_LINK }}
            VITE_EMAIL_ADDRESS=${{ vars.VITE_EMAIL_ADDRESS }}
            VITE_TIKTOK_LINK=${{ vars.VITE_TIKTOK_LINK }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps, docker]
    steps:
      - name: Pull latest image and redeploy
        working-directory: /root/izr-server
        run: |
          docker compose -p izr-server -f docker-compose.yml --env-file .env pull website
          docker compose -p izr-server -f docker-compose.yml --env-file .env up -d website
          docker image prune -f
