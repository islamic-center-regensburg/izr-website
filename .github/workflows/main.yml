name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  security:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan dependencies for vulnerabilities
        # Non-blocking for now: surfaces pre-existing CVEs in transitive
        # dev-tooling deps (vite/vitest/etc.) not shipped in the runtime
        # image. Revisit once the backlog is triaged, then drop continue-on-error.
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Scan Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  build:
    name: Build & push image
    needs: [checks, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image version
        id: vars
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/izr-website:${{ steps.vars.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/izr-website:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_MOSQUE_NAME=${{ vars.VITE_MOSQUE_NAME }}
            VITE_INSTAGRAM_LINK=${{ vars.VITE_INSTAGRAM_LINK }}
            VITE_FACEBOOK_LINK=${{ vars.VITE_FACEBOOK_LINK }}
            VITE_EMAIL_ADDRESS=${{ vars.VITE_EMAIL_ADDRESS }}
            VITE_TIKTOK_LINK=${{ vars.VITE_TIKTOK_LINK }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps, docker]
    steps:
      - name: Pull latest image and redeploy
        working-directory: /root/izr-server
        run: |
          docker compose -p izr-server -f docker-compose.yml --env-file .env pull website
          docker compose -p izr-server -f docker-compose.yml --env-file .env up -d website
          docker image prune -f
